schema_version = "1.0.0"

id = "kitsune_tools"
name = "Kitsune Tools"
version = "0.2.0"
tagline = "Set of tools for Blender that can be useful for assisting on character rigging. Previously embedded within KitsuneSourceTool"
maintainer = "Toppi"
type = "add-on"

blender_version_min = "4.5.0"

license = ["SPDX:GPL-3.0-or-later"]

# cp311 wheels cover Blender 4.5 / 5.0 (Python 3.11); cp313 wheels cover
# Blender 5.1+ (Python 3.13). Blender loads the ABI-matching wheel at runtime.
wheels = [
    "./wheels/pillow-12.1.0-cp311-cp311-macosx_10_10_x86_64.whl",
    "./wheels/pillow-12.1.0-cp311-cp311-macosx_11_0_arm64.whl",
    "./wheels/pillow-12.1.0-cp311-cp311-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl",
    "./wheels/pillow-12.1.0-cp311-cp311-win_amd64.whl",
    "./wheels/pillow-12.1.0-cp313-cp313-macosx_10_13_x86_64.whl",
    "./wheels/pillow-12.1.0-cp313-cp313-macosx_11_0_arm64.whl",
    "./wheels/pillow-12.1.0-cp313-cp313-manylinux_2_27_x86_64.manylinux_2_28_x86_64.whl",
    "./wheels/pillow-12.1.0-cp313-cp313-win_amd64.whl",
]